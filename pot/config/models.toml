[provider]
name = "cirrascale"
base_url = "https://aisuite.cirrascale.com/apis/v2"
api_key_env = "CIRRASCALE_API_KEY"
timeout_seconds = 90

[roles.intake_normaliser]
model = "Qwen/Qwen3-8B"
temperature = 0.0
fallback = []
additional_params = { enable_thinking = false }

[roles.reasoner]
model = "meta-llama/Llama-3.3-70B-Instruct"
temperature = 0.2
fallback = ["meta-llama/Llama-3.1-8B-Instruct"]

[roles.consistency_reviewer]
model = "meta-llama/Llama-3.1-8B-Instruct"
temperature = 0.0
fallback = []

[roles.alternative_reasoner]
model = "Qwen/Qwen2.5-32B-Instruct"
temperature = 0.2
fallback = []
confirmed = false
confirmation_note = "Unconfirmed checkpoint; user must confirm exact Qwen2.5 32B model ID."
