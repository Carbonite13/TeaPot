[provider]
name = "cirrascale"
base_url = "https://aisuite.cirrascale.com/apis/v2"
api_key_env = "CIRRASCALE_API_KEY"
timeout_seconds = 90

[roles.intake_normaliser]
model = "Llama-3.1-8B"
temperature = 0.0
fallback = []
additional_params = {}

[roles.reasoner]
model = "Llama-3.3-70B"
temperature = 0.2
fallback = ["Llama-3.1-8B"]

[roles.consistency_reviewer]
model = "Llama-3.1-8B"
temperature = 0.0
fallback = []

[roles.alternative_reasoner]
model = "DeepSeek-R1-Distill-Llama-70B"
temperature = 0.2
fallback = []
confirmed = true
confirmation_note = "Confirmed from Cirrascale model catalogue: ['DeepSeek-R1-Distill-Llama-70B', 'Llama-3.1-8B', 'Llama-3.3-70B', 'Qwen-QwQ-32B']."

