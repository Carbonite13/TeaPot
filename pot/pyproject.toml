[project]
name = "duk-slice-advisor"
version = "0.1.0"
description = "Decision support for 5G network slice selection"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[openai]>=1.15.28,<2.0.0",
    "fastapi>=0.115,<1.0",
    "numpy>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
    "structlog>=24.4,<26.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
duk = "duk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.hatch.build.targets.wheel]
packages = ["src/duk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
